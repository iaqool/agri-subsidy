name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: agent/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx ruff
      - name: Lint (ruff)
        run: ruff check .
      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend (Vite + React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
      - name: Lint
        run: npm run lint --if-present
      - name: Build
        run: npm run build

  contracts:
    name: Contracts (Anchor / Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    # Stable toolchain is sufficient for the non-BPF `cargo check` smoke pass;
    # the BPF build + mocha suite lives in the dedicated contracts-tests job.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: cargo check
        run: cargo +stable check --package agri_subsidy
      - name: cargo clippy (informational)
        run: cargo +stable clippy --package agri_subsidy || true

  contracts-tests:
    # Lightweight wiring for the contracts mocha suite
    # (contracts/tests/agri_subsidy.test.ts).
    #
    # *** Why this job does NOT run `anchor test` in CI ***
    #
    # The full mocha suite needs `anchor build` (BPF compile) + an in-process
    # solana-test-validator. We hit an unresolvable toolchain triangle with the
    # currently shipped contract:
    #
    #   * anchor-lang 0.29 transitive deps (toml_datetime etc.) require
    #     edition2024, which was stabilized in rustc 1.85.
    #   * solana-cli 1.18.17 (pinned in Anchor.toml) ships cargo-build-sbf with
    #     rustc 1.79, which can neither compile edition2024 crates nor read a
    #     v4 Cargo.lock (v4 needs cargo ≥1.81).
    #   * The host cargo on ubuntu-24.04 runners is 1.95 and writes v4 locks by
    #     default, so any IDL/host-cargo step poisons the lockfile for the BPF
    #     build.
    #
    # Unblocking the BPF build in CI requires either bumping anchor to 0.30+ /
    # agave 2.x+ (program code change — out of scope for this PR) or pinning
    # several transitive deps below their edition2024 cut. Both are tracked as
    # follow-ups.
    #
    # What we DO run in CI: `npm install` to validate the mocha harness
    # (package.json / tsconfig.json) installs cleanly. `tsc --noEmit` is NOT
    # run because contracts/tests/agri_subsidy.test.ts imports
    # `../target/types/agri_subsidy`, which is emitted by `anchor build` and is
    # therefore unavailable to a CI runner that can't build the program. The
    # full mocha suite is runnable locally via `cd contracts && anchor test`
    # once a developer has the matching toolchain.
    name: Contracts (mocha harness)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install node deps
        run: npm install --no-audit --no-fund

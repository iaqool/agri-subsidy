name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: agent/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx ruff
      - name: Lint (ruff)
        run: ruff check .
      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend (Vite + React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
      - name: Lint
        run: npm run lint --if-present
      - name: Build
        run: npm run build

  contracts:
    name: Contracts (Anchor / Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    # Stable toolchain is sufficient for the non-BPF `cargo check` smoke pass;
    # the BPF build + mocha suite lives in the dedicated contracts-tests job.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: cargo check
        run: cargo +stable check --package agri_subsidy
      - name: cargo clippy (informational)
        run: cargo +stable clippy --package agri_subsidy || true

  contracts-tests:
    # End-to-end mocha suite (contracts/tests/agri_subsidy.test.ts) running
    # against an in-process solana-test-validator. This is the regression net
    # for the M-of-N quorum / parameterized-policy / idempotent-attestation
    # logic in lib.rs — the smoke `cargo check` job above will happily pass on
    # changes that silently break the on-chain invariants.
    name: Contracts (mocha)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      RUSTUP_TOOLCHAIN: stable
      SOLANA_VERSION: v1.18.17
      ANCHOR_VERSION: 0.29.0
      ANCHOR_WALLET: /home/runner/.config/solana/id.json
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache Solana CLI
        id: cache-solana
        uses: actions/cache@v4
        with:
          path: /home/runner/.local/share/solana/install
          key: solana-${{ env.SOLANA_VERSION }}
      - name: Install Solana CLI
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
      - name: Export Solana on PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Generate ephemeral wallet keypair
        run: |
          mkdir -p "$(dirname "$ANCHOR_WALLET")"
          solana-keygen new --no-bip39-passphrase --silent --force --outfile "$ANCHOR_WALLET"
          solana config set --url localhost --keypair "$ANCHOR_WALLET"
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Cache Anchor CLI
        id: cache-anchor
        uses: actions/cache@v4
        with:
          path: /home/runner/.cargo/bin/anchor
          key: anchor-${{ env.ANCHOR_VERSION }}
      - name: Install Anchor CLI
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: cargo binstall --no-confirm anchor-cli@${ANCHOR_VERSION}
      # anchor 0.29's build/test paths shell out to `yarn` for IDL packaging
      # even when the project itself uses npm, so we install it globally to
      # avoid the spurious "No such file or directory" the binary returns on
      # spawn("yarn") failure.
      - name: Install yarn (used by anchor 0.29 IDL pipeline)
        run: npm install -g yarn
      - name: Install node deps
        run: npm install --no-audit --no-fund
      - name: Toolchain diagnostics
        run: |
          set -x
          which anchor solana cargo rustc node npm npx yarn cargo-build-sbf || true
          anchor --version
          solana --version
          rustc --version
          cargo --version
          node --version
          npm --version
          ls -la
      # anchor 0.29's `[toolchain] anchor_version = "0.29.0"` in Anchor.toml
      # triggers an avm dispatch on every `anchor` command. avm is not installed
      # in CI (and installing it requires compiling from source, ~5 min), so we
      # strip the section here. The pinned versions are also encoded in the
      # workflow env (SOLANA_VERSION, ANCHOR_VERSION) so we keep deterministic
      # tooling without going through avm.
      - name: Strip [toolchain] section from Anchor.toml for CI
        run: |
          python3 -c "import re,sys,io,pathlib;p=pathlib.Path('Anchor.toml');s=p.read_text();s=re.sub(r'(?ms)^\\[toolchain\\].*?(?=^\\[|\\Z)','',s);p.write_text(s);print(s)"
      # The committed Cargo.lock is v4 (written by cargo 1.81+), but anchor 0.29
      # builds with cargo-build-sbf which ships a rustc 1.75 toolchain that only
      # understands lock format v3. Drop the lock so the BPF build regenerates
      # one in a compatible format.
      - name: Drop Cargo.lock so BPF cargo regenerates a compatible lockfile
        run: rm -f Cargo.lock
      - name: Anchor build (BPF compile + IDL emit)
        run: anchor build
      - name: Anchor test (skip build, use embedded validator)
        run: anchor test --skip-build --provider.cluster localnet
